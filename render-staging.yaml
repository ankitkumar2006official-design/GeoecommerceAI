services:
  # 1. Staging Node.js Express Backend
  - type: web
    name: geocommerce-api-staging
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: mongodb+srv://<user>:<password>@cluster.mongodb.net/tracker_staging?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true # Auto-generates high-entropy cryptographic secret on Render
      - key: FRONTEND_URL
        value: https://geocommerce-ai-staging.vercel.app
      - key: ML_SERVICE_URL
        value: https://geocommerce-ml-staging.onrender.com
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: GeoCommerce AI <onboarding@resend.dev>

  # 2. Staging Python FastAPI ML Microservice
  - type: web
    name: geocommerce-ml-staging
    env: python
    plan: free
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

